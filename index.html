<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>模拟大A游戏</title>
<style>
  :root { --bg:#0c0a09; --card:#1c1614; --up:#ff4d4f; --down:#52c41a; --text:#d4c8b8; --muted:#8a7a6a; }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Georgia,serif;background:var(--bg);color:var(--text);padding:16px;max-width:1300px;margin:0 auto}
  .layout{display:grid;grid-template-columns:1fr 300px;gap:16px}
  h1{font-size:22px;margin-bottom:6px;color:#e8dcc8}
  .header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap}
  .cash{font-size:18px;color:#c9a87c;font-weight:bold}
  .mode-bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
  .mode-bar button.active{background:#6b5a45}
  button{background:#6b5a45;border:1px solid #8b7355;color:#f0e6d8;padding:7px 12px;border-radius:4px;cursor:pointer}
  button.short{background:#8a5a3a} button.sell{background:#8a3a3a}
  input,select{background:#2a221e;border:1px solid #4a3c34;color:var(--text);padding:6px 10px;border-radius:4px}
  .section{background:#1c1614;border:1px solid #3a2e28;border-radius:8px;padding:14px;margin-bottom:14px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:6px 4px;border-bottom:1px solid #2a221e;text-align:left}
  .summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:10px}
  .summary-item{background:#2a221e;padding:8px;border-radius:6px;text-align:center}
  .summary-item .label{font-size:12px;color:#8a7a6a}
  .summary-item .value{font-size:15px;font-weight:bold;margin-top:2px}
  .up{color:#ff4d4f}.down{color:#52c41a}
  #progressSection{margin:8px 0; user-select:none}
  .progress-wrap{background:#2a221e;height:10px;border-radius:5px;overflow:hidden;pointer-events:none}
  .progress-bar{height:100%;background:#c9a87c;width:0%;pointer-events:none}
  #chartBox{background:#12100e;border:1px solid #3a2e28;border-radius:8px;padding:10px;margin-bottom:14px}
  canvas{width:100%;height:240px;display:block}
  .add-bar{display:flex;gap:8px;margin-bottom:10px}
  .add-bar input{flex:1}
  .sidebar{position:sticky;top:16px;max-height:90vh;overflow-y:auto}
  .panel{background:#1c1614;border:1px solid #3a2e28;border-radius:8px;padding:12px;margin-bottom:12px}
  .panel h3{font-size:15px;margin-bottom:8px;color:#d4c4a8}
  .lb-item{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #2a221e;font-size:13px}
  .lb-item.me{background:#2a221e;border-radius:4px;padding:5px}
  .achieve{font-size:12px;padding:4px 0;border-bottom:1px solid #2a221e}
  .achieve.done{color:#52c41a}
  #newsBox{margin-top:16px}
  .news{background:#3a2e28;padding:8px;border-radius:4px;margin:6px 0;font-size:13px}
  .news.good{border-left:3px solid #52c41a}
  .news.bad{border-left:3px solid #ff4d4f}
  .month-champ{font-size:13px;padding:6px 0;border-bottom:1px solid #2a221e}
</style>
</head>
<body>
  <div class="layout">
    <div>
      <div class="header">
        <h1>模拟大A 游戏</h1>
        <div class="cash">可用资金：<span id="cash">100,000.00</span></div>
      </div>
      <div class="mode-bar">
        <button id="btnRealtime" class="active" onclick="setMode('realtime')">实时</button>
        <button id="btnOffline" onclick="setMode('offline')">离线模拟当日</button>
        <button onclick="resetGame()">重置</button>
        <button onclick="startChallenge()">挑战</button>
        <button onclick="replay()">回放</button>
        <select id="chartSelect" onchange="drawChart()"><option value="">选择图表</option></select>
        <select id="leverage" onchange="updateLeverage()">
          <option value="1">1倍</option>
          <option value="2">2倍杠杆</option>
          <option value="3">3倍杠杆</option>
          <option value="5">5倍杠杆</option>
        </select>
      </div>
      <div id="progressSection" style="display:none">
        <div class="progress-wrap"><div class="progress-bar" id="dayProgress"></div></div>
        <div style="font-size:12px;color:#8a7a6a;text-align:right" id="progressText">进度 0%</div>
      </div>
      <div id="chartBox"><canvas id="chart"></canvas></div>
      <div class="indices" id="indices" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:12px"></div>
      <div class="section">
        <h2>自选</h2>
        <div class="add-bar">
          <input id="codeInput" placeholder="输入股票代码如 600519 或 000001" />
          <button onclick="addStock()">添加</button>
        </div>
        <table>
          <thead><tr><th>名称</th><th>代码</th><th>现价</th><th>涨跌</th><th>操作</th></tr></thead>
          <tbody id="watchlist"></tbody>
        </table>
      </div>
      <div class="section">
        <h2>我的持仓</h2>
        <div class="summary">
          <div class="summary-item"><div class="label">可用资金</div><div class="value" id="sCash">100000</div></div>
          <div class="summary-item"><div class="label">持仓市值</div><div class="value" id="sMv">0</div></div>
          <div class="summary-item"><div class="label">总资产</div><div class="value" id="sTotal">100000</div></div>
          <div class="summary-item"><div class="label">当日累计盈亏</div><div class="value" id="sPnl">0</div></div>
          <div class="summary-item"><div class="label">仓位</div><div class="value" id="sRatio">0%</div></div>
        </div>
        <table>
          <thead><tr><th>名称</th><th>代码</th><th>方向</th><th>数量</th><th>成本</th><th>现价</th><th>浮盈</th><th>操作</th></tr></thead>
          <tbody id="positions"></tbody>
        </table>
      </div>
      <div id="newsBox"></div>
      <div style="font-size:12px;color:#8a7a6a;text-align:right;margin-top:8px" id="updateTime"></div>
    </div>
    <div class="sidebar">
      <div class="panel">
        <h3>当日盈利排行</h3>
        <div id="profitList"></div>
      </div>
      <div class="panel">
        <h3>当日亏损排行</h3>
        <div id="lossList"></div>
      </div>
      <div class="panel">
        <h3>本月盈利冠军</h3>
        <div id="monthChamp" class="month-champ">暂无</div>
        <h3 style="margin-top:10px">本月亏损王</h3>
        <div id="monthKing" class="month-champ">暂无</div>
      </div>
      <div class="panel">
        <h3>成就</h3>
        <div id="achievements"></div>
      </div>
      <div class="panel">
        <h3>今日挑战</h3>
        <div id="challenge" style="font-size:13px;color:#d4c4a8">点击「挑战」开始</div>
      </div>
    </div>
  </div>

<script>
let cash = 100000;
let mode = 'realtime';
let leverage = 1;
let watchlist = [
  {code:'600519', name:'贵州茅台', base:1680},
  {code:'000858', name:'五粮液', base:145},
  {code:'300750', name:'宁德时代', base:210},
  {code:'000001', name:'平安银行', base:11.5}
];
let positions = {};
let quotes = {};
let priceHistory = {};
let trades = [];
let simTime = 0;
let simTimer = null;
let myName = localStorage.getItem('aShareName') || '';
let realizedPnl = 0;
let achievements = JSON.parse(localStorage.getItem('aShareAch') || '{}');
let challenge = null;
let replayData = null;

function playSound(type){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.frequency.value = type==='buy'?440:type==='sell'?330:type==='win'?660:220;
    g.gain.value = 0.08;
    o.start(); o.stop(ctx.currentTime+0.15);
  }catch(e){}
}

function unlock(id, name){
  if(!achievements[id]){
    achievements[id] = true;
    localStorage.setItem('aShareAch', JSON.stringify(achievements));
    playSound('win');
    alert('解锁成就：'+name);
  }
  renderAchievements();
}

function renderAchievements(){
  const list = [
    {id:'first', name:'初次开仓'},
    {id:'profit5', name:'单日盈利超 5%'},
    {id:'profit10', name:'单日盈利超 10%'},
    {id:'shortwin', name:'做空盈利'},
    {id:'leverage', name:'使用杠杆'},
    {id:'challenge', name:'完成挑战'}
  ];
  document.getElementById('achievements').innerHTML = list.map(a=>
    `<div class="achieve ${achievements[a.id]?'done':''}">${achievements[a.id]?'✓':'○'} ${a.name}</div>`
  ).join('');
}

function loadLeaderboard(){
  let lb = JSON.parse(localStorage.getItem('aShareLB') || '[]');
  if(lb.length < 8){
    const prefixes = ['散户','游资','短线','长线','量化','价值','技术','波段','趋势'];
    const suffixes = ['小王','阿强','老李','小张','阿明','小刘','老周','阿林','小陈','老吴'];
    for(let i=0;i<12;i++){
      const name = prefixes[Math.floor(Math.random()*prefixes.length)] + suffixes[Math.floor(Math.random()*suffixes.length)] + Math.floor(Math.random()*100);
      lb.push({name, pnl: Math.floor((Math.random()-0.4)*18000)});
    }
    localStorage.setItem('aShareLB', JSON.stringify(lb));
  }
  return lb;
}

function loadMonthData(){
  const key = 'aShareMonth_' + new Date().toISOString().slice(0,7);
  let data = JSON.parse(localStorage.getItem(key) || '[]');
  if(data.length < 5){
    const prefixes = ['散户','游资','短线','长线','量化'];
    const suffixes = ['小王','阿强','老李','小张','阿明'];
    for(let i=0;i<8;i++){
      const name = prefixes[Math.floor(Math.random()*prefixes.length)] + suffixes[Math.floor(Math.random()*suffixes.length)] + Math.floor(Math.random()*50);
      data.push({name, pnl: Math.floor((Math.random()-0.35)*50000)});
    }
    localStorage.setItem(key, JSON.stringify(data));
  }
  return data;
}

function saveMyPnl(pnl, name){
  let lb = loadLeaderboard();
  const idx = lb.findIndex(x=>x.name===name);
  if(idx>=0) lb[idx].pnl = pnl;
  else lb.push({name, pnl});
  lb.sort((a,b)=>b.pnl-a.pnl);
  localStorage.setItem('aShareLB', JSON.stringify(lb.slice(0,30)));

  const key = 'aShareMonth_' + new Date().toISOString().slice(0,7);
  let month = JSON.parse(localStorage.getItem(key) || '[]');
  const midx = month.findIndex(x=>x.name===name);
  if(midx>=0) month[midx].pnl += pnl;
  else month.push({name, pnl});
  localStorage.setItem(key, JSON.stringify(month));

  renderAllLeaderboards();
}

function askSubmitToLeaderboard(pnl){
  const msg = `今日模拟结束\n累计盈利：${pnl>=0?'+':''}${fmt(pnl)}\n\n是否留名上榜？`;
  if(confirm(msg)){
    const name = prompt('请输入您的昵称：', myName || '散户小王');
    if(name && name.trim()){
      myName = name.trim();
      localStorage.setItem('aShareName', myName);
      saveMyPnl(pnl, myName);
      alert('已上榜！');
    }
  }
  const rate = pnl / 100000 * 100;
  if(rate >= 5) unlock('profit5','单日盈利超 5%');
  if(rate >= 10) unlock('profit10','单日盈利超 10%');
  if(challenge && pnl > 0) unlock('challenge','完成挑战');
}

function renderAllLeaderboards(){
  const lb = loadLeaderboard();
  const profit = [...lb].sort((a,b)=>b.pnl-a.pnl).slice(0,10);
  const loss = [...lb].sort((a,b)=>a.pnl-b.pnl).slice(0,10);

  document.getElementById('profitList').innerHTML = profit.map((item,i)=>{
    const isMe = item.name === myName;
    return `<div class="lb-item ${isMe?'me':''}">
      <span>${i+1}</span>
      <span>${item.name}${isMe?'（我）':''}</span>
      <span class="${item.pnl>=0?'up':'down'}">${item.pnl>=0?'+':''}${fmt(item.pnl)}</span>
    </div>`;
  }).join('');

  document.getElementById('lossList').innerHTML = loss.map((item,i)=>{
    const isMe = item.name === myName;
    return `<div class="lb-item ${isMe?'me':''}">
      <span>${i+1}</span>
      <span>${item.name}${isMe?'（我）':''}</span>
      <span class="${item.pnl>=0?'up':'down'}">${item.pnl>=0?'+':''}${fmt(item.pnl)}</span>
    </div>`;
  }).join('');

  const month = loadMonthData();
  const champ = [...month].sort((a,b)=>b.pnl-a.pnl)[0];
  const king = [...month].sort((a,b)=>a.pnl-b.pnl)[0];
  document.getElementById('monthChamp').innerHTML = champ ? `${champ.name} <span class="up">+${fmt(champ.pnl)}</span>` : '暂无';
  document.getElementById('monthKing').innerHTML = king ? `${king.name} <span class="down">${fmt(king.pnl)}</span>` : '暂无';
}

function fmt(n){ return Number(n).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function color(v){ return v>0?'up':v<0?'down':''; }

function updateLeverage(){
  leverage = +document.getElementById('leverage').value;
  if(leverage>1) unlock('leverage','使用杠杆');
}

function startChallenge(){
  const challenges = [
    '只用做空赚正收益',
    '单笔盈利超过 3%',
    '完成至少 3 次交易',
    '不使用杠杆赚 2%'
  ];
  challenge = challenges[Math.floor(Math.random()*challenges.length)];
  document.getElementById('challenge').textContent = '今日挑战：'+challenge;
  alert('挑战开始：'+challenge);
}

function showNews(){
  if(mode!=='offline' || Math.random()>0.15) return;
  const goods = ['重大利好！业绩超预期','政策支持，板块拉升','机构大举买入'];
  const bads = ['突发利空，业绩下滑','监管风险提示','大宗减持'];
  const isGood = Math.random()>0.5;
  const text = (isGood?goods:bads)[Math.floor(Math.random()*3)];
  const div = document.createElement('div');
  div.className = 'news '+(isGood?'good':'bad');
  div.textContent = '【消息】'+text;
  const box = document.getElementById('newsBox');
  box.prepend(div);
  setTimeout(()=>div.remove(), 8000);
  Object.keys(quotes).forEach(code=>{
    const q = quotes[code];
    const impact = (isGood?1:-1) * (0.01+Math.random()*0.02);
    q.price = Math.max(0.01, q.price*(1+impact));
  });
  playSound(isGood?'win':'sell');
}

function setMode(m){
  mode = m;
  document.getElementById('btnRealtime').classList.toggle('active', m==='realtime');
  document.getElementById('btnOffline').classList.toggle('active', m==='offline');
  document.getElementById('progressSection').style.display = m==='offline'?'block':'none';
  if(simTimer) clearInterval(simTimer);
  if(m==='offline'){
    initOffline();
    simTimer = setInterval(stepOffline, 800);
  } else updateRealtime();
}

function initOffline(){
  simTime = 0;
  trades = [];
  realizedPnl = 0;
  replayData = [];
  watchlist.forEach(w=>{
    quotes[w.code] = {name:w.name, price:w.base, change:0, pre:w.base};
    priceHistory[w.code] = [w.base];
  });
  updateChartSelect();
  document.getElementById('chartSelect').value = watchlist[0].code;
  renderAll();
  drawChart();
  document.getElementById('updateTime').textContent = '离线模拟开始';
}

function stepOffline(){
  if(simTime>=240){
    clearInterval(simTimer);
    document.getElementById('updateTime').textContent='收盘';
    const totalPnl = realizedPnl + getFloatingPnl();
    replayData = {prices:JSON.parse(JSON.stringify(priceHistory)), trades:[...trades]};
    setTimeout(()=> askSubmitToLeaderboard(totalPnl), 300);
    return;
  }
  simTime++;
  showNews();
  Object.keys(quotes).forEach(code=>{
    const q = quotes[code];
    const chg = (Math.random()-0.5)*0.009;
    q.price = Math.max(0.01, q.price*(1+chg));
    q.change = ((q.price/q.pre)-1)*100;
    if(!priceHistory[code]) priceHistory[code]=[];
    priceHistory[code].push(q.price);
  });
  renderAll();
  drawChart();
  const pct = (simTime/240*100).toFixed(0);
  document.getElementById('dayProgress').style.width = pct+'%';
  document.getElementById('progressText').textContent = `进度 ${pct}% · ${simTime}分`;
  document.getElementById('updateTime').textContent = `离线 ${simTime}/240 分`;
}

function getFloatingPnl(){
  let pnl=0;
  Object.entries(positions).forEach(([code,p])=>{
    const price = quotes[code]?.price || p.cost;
    const abs = Math.abs(p.shares);
    pnl += p.shares>0 ? (price-p.cost)*abs : (p.cost-price)*abs;
  });
  return pnl * leverage;
}

async function updateRealtime(){
  if(mode!=='realtime') return;
  try{
    const codes = watchlist.map(w=> (w.code.startsWith('6')?'1.':'0.')+w.code).join(',');
    const res = await fetch(`https://push2.eastmoney.com/api/qt/ulist.np/get?fltt=2&secids=${codes}&fields=f2,f3,f12,f14&_=${Date.now()}`);
    const data = await res.json();
    (data.data?.diff||[]).forEach(i=>{
      quotes[i.f12] = {name:i.f14, price:i.f2, change:i.f3};
      if(!priceHistory[i.f12]) priceHistory[i.f12]=[];
      priceHistory[i.f12].push(i.f2);
      if(priceHistory[i.f12].length>120) priceHistory[i.f12].shift();
    });
  }catch(e){}
  renderAll();
  drawChart();
  document.getElementById('updateTime').textContent = '实时 '+new Date().toLocaleTimeString();
}

function updateChartSelect(){
  const sel = document.getElementById('chartSelect');
  const cur = sel.value;
  sel.innerHTML = '<option value="">选择图表</option>' + watchlist.map(w=>`<option value="${w.code}">${w.name} ${w.code}</option>`).join('');
  if(cur) sel.value = cur;
}

function drawChart(){
  const code = document.getElementById('chartSelect').value || watchlist[0].code;
  const box = document.getElementById('chartBox');
  const canvas = document.getElementById('chart');
  const hist = priceHistory[code];
  if(!hist || hist.length<2){ 
    const ctx = canvas.getContext('2d');
    canvas.width = canvas.offsetWidth*2; canvas.height=480;
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle='#8a7a6a'; ctx.font='28px Georgia';
    ctx.fillText('等待数据...', canvas.width/2-60, canvas.height/2);
    return; 
  }
  box.style.display='block';

  const ctx = canvas.getContext('2d');
  const w = canvas.width = canvas.offsetWidth * 2;
  const h = canvas.height = 480;
  ctx.clearRect(0,0,w,h);

  ctx.strokeStyle = '#2a2a2a';
  ctx.lineWidth = 1;
  for(let i=1;i<5;i++){
    const y = h*0.1 + (h*0.7)*i/5;
    ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(w,y); ctx.stroke();
  }
  for(let i=1;i<6;i++){
    const x = w*i/6;
    ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,h*0.8); ctx.stroke();
  }

  let prices = hist;
  let drawWidth = w;
  if(mode==='offline'){
    const progress = simTime / 240;
    drawWidth = w * progress;
    prices = hist;
  } else {
    prices = hist.slice(-120);
  }

  if(prices.length<2) return;

  const max = Math.max(...prices);
  const min = Math.min(...prices);
  const range = max-min || 1;
  const top = h*0.08, bot = h*0.78;

  ctx.beginPath();
  prices.forEach((p,i)=>{
    const x = (i/(prices.length-1)) * drawWidth;
    const y = bot - ((p-min)/range)*(bot-top);
    if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  });
  ctx.strokeStyle = '#ff4d4f';
  ctx.lineWidth = 2.5;
  ctx.stroke();

  const ma = [];
  for(let i=0;i<prices.length;i++){
    const start = Math.max(0,i-9);
    const slice = prices.slice(start,i+1);
    ma.push(slice.reduce((a,b)=>a+b,0)/slice.length);
  }
  ctx.beginPath();
  ma.forEach((p,i)=>{
    const x = (i/(ma.length-1)) * drawWidth;
    const y = bot - ((p-min)/range)*(bot-top);
    if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  });
  ctx.strokeStyle = '#f5c518';
  ctx.lineWidth = 2;
  ctx.stroke();

  trades.filter(t=>t.code===code).forEach(t=>{
    if(mode==='offline' && t.simTime > simTime) return;
    const idx = Math.min(prices.length-1, Math.floor((t.simTime/240)*prices.length));
    const x = (idx/(prices.length-1)) * drawWidth;
    const y = bot - ((t.price-min)/range)*(bot-top);
    ctx.fillStyle = t.type==='B' ? '#52c41a' : '#ff4d4f';
    ctx.beginPath();
    ctx.arc(x, y, 8, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 14px Arial';
    ctx.fillText(t.type, x-5, y+5);
  });

  const volH = h*0.18;
  for(let i=1;i<prices.length;i++){
    const x = (i/(prices.length-1)) * drawWidth;
    const vol = 0.25 + Math.random()*0.75;
    const vh = vol * volH;
    ctx.fillStyle = prices[i] >= prices[i-1] ? '#ff4d4f88' : '#52c41a88';
    ctx.fillRect(x-3, h-vh, 5, vh);
  }
}

function renderAll(){
  document.getElementById('indices').innerHTML = watchlist.slice(0,4).map(w=>{
    const q = quotes[w.code]||{};
    const ch = q.change||0;
    return `<div style="background:#1c1614;padding:8px;border-radius:6px;text-align:center"><div style="font-size:12px;color:#8a7a6a">${w.name}</div><div class="${color(ch)}">${fmt(q.price||0)}</div><div class="${color(ch)}">${ch>0?'+':''}${ch.toFixed(2)}%</div></div>`;
  }).join('');

  document.getElementById('watchlist').innerHTML = watchlist.map(w=>{
    const q = quotes[w.code]||{};
    const ch = q.change||0;
    return `<tr>
      <td>${w.name}</td><td>${w.code}</td>
      <td class="${color(ch)}">${fmt(q.price||0)}</td>
      <td class="${color(ch)}">${ch>0?'+':''}${ch.toFixed(2)}%</td>
      <td>
        <button onclick="openPos('${w.code}','long')">做多</button>
        <button class="short" onclick="openPos('${w.code}','short')">做空</button>
      </td>
    </tr>`;
  }).join('');

  let mv=0;
  const floating = getFloatingPnl();
  const totalPnl = realizedPnl + floating;
  const rows = Object.entries(positions).map(([code, p])=>{
    const q = quotes[code]||{};
    const price = q.price || p.cost;
    const isLong = p.shares>0;
    const abs = Math.abs(p.shares);
    const value = price * abs;
    const profit = (isLong ? (price-p.cost)*abs : (p.cost-price)*abs) * leverage;
    mv += isLong ? value : -value;
    return `<tr>
      <td>${p.name}</td><td>${code}</td>
      <td>${isLong?'多':'空'}</td><td>${abs}</td>
      <td>${fmt(p.cost)}</td>
      <td class="${color(profit)}">${fmt(price)}</td>
      <td class="${color(profit)}">${profit>0?'+':''}${fmt(profit)}</td>
      <td><button class="sell" onclick="closePos('${code}')">平仓</button></td>
    </tr>`;
  }).join('');
  document.getElementById('positions').innerHTML = rows || '<tr><td colspan="8" style="text-align:center;color:#8a7a6a">暂无持仓</td></tr>';

  const total = cash + mv;
  document.getElementById('sCash').textContent = fmt(cash);
  document.getElementById('sMv').textContent = fmt(mv);
  document.getElementById('sTotal').textContent = fmt(total);
  document.getElementById('sPnl').textContent = (totalPnl>0?'+':'')+fmt(totalPnl);
  document.getElementById('sPnl').className = 'value '+color(totalPnl);
  document.getElementById('cash').textContent = fmt(cash);
  const used = Object.values(positions).reduce((s,p)=>s+Math.abs(p.shares)*(quotes[Object.keys(positions).find(k=>positions[k]===p)]?.price||p.cost),0);
  document.getElementById('sRatio').textContent = ((used/(cash+Math.abs(mv)||1))*100).toFixed(1)+'%';
}

function openPos(code, side){
  const q = quotes[code];
  if(!q || !q.price){ alert('暂无行情，请先切到离线模拟'); return; }
  const price = q.price;
  const qtyStr = prompt(`做${side==='long'?'多':'空'} ${q.name}（${code}）\n现价：${fmt(price)}\n杠杆：${leverage}倍\n输入股数（100整数倍）：`, '100');
  if(!qtyStr) return;
  const qty = parseInt(qtyStr);
  if(isNaN(qty) || qty<=0 || qty%100!==0){ alert('请输入100的整数倍'); return; }
  const amount = price * qty / leverage;
  if(amount > cash){ alert('资金不足'); return; }
  cash -= amount;
  if(!positions[code]) positions[code] = {shares:0, cost:0, name:q.name};
  const pos = positions[code];
  const oldAbs = Math.abs(pos.shares);
  const totalCost = pos.cost * oldAbs + price * qty;
  pos.shares += (side==='long' ? qty : -qty);
  const newAbs = Math.abs(pos.shares);
  pos.cost = newAbs>0 ? totalCost / newAbs : 0;
  if(pos.shares===0) delete positions[code];
  trades.push({code, type:'B', price, simTime});
  unlock('first','初次开仓');
  playSound('buy');
  renderAll();
  document.getElementById('chartSelect').value = code;
  drawChart();
  alert(`开仓成功！${side==='long'?'多':'空'} ${qty}股（${leverage}倍）`);
}

function closePos(code){
  const pos = positions[code];
  if(!pos) return;
  const q = quotes[code];
  if(!q || !q.price){ alert('暂无行情'); return; }
  const abs = Math.abs(pos.shares);
  const profit = (pos.shares>0 ? (q.price-pos.cost)*abs : (pos.cost-q.price)*abs) * leverage;
  realizedPnl += profit;
  if(pos.shares<0 && profit>0) unlock('shortwin','做空盈利');
  cash += q.price * abs / leverage + profit;
  delete positions[code];
  trades.push({code, type:'S', price:q.price, simTime, pnl:profit});
  playSound(profit>0?'win':'sell');
  renderAll();
  drawChart();
}

function addStock(){
  const code = document.getElementById('codeInput').value.trim();
  if(!code) return alert('请输入股票代码');
  if(watchlist.find(w=>w.code===code)) return alert('已存在');
  const base = 10 + Math.random()*100;
  watchlist.push({code, name:code, base});
  quotes[code] = {name:code, price:base, change:0, pre:base};
  priceHistory[code] = [base];
  document.getElementById('codeInput').value = '';
  updateChartSelect();
  renderAll();
  if(mode==='offline') drawChart();
  alert('已添加 '+code);
}

function resetGame(){
  if(!confirm('重置资金和持仓？')) return;
  cash = 100000;
  positions = {};
  realizedPnl = 0;
  trades = [];
  renderAll();
  if(mode==='offline') initOffline();
}

function replay(){
  if(!replayData) return alert('请先完成一次离线模拟');
  alert('回放功能：可查看本次交易的 B/S 点和最终盈亏。');
}

renderAchievements();
renderAllLeaderboards();
updateChartSelect();
setMode('realtime');
setInterval(()=>{ if(mode==='realtime') updateRealtime(); }, 6000);
window.addEventListener('resize', drawChart);
</script>
