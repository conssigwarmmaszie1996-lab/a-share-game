<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>模拟大A游戏</title>
<style>
  :root {
    --bg: #0c0a09; --card: #1c1614; --up: #ff4d4f; --down: #52c41a;
    --text: #d4c8b8; --muted: #8a7a6a; --accent: #8b7355; --short: #c47a4a; --border: #2a221e;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Georgia","Times New Roman",serif;background:var(--bg);color:var(--text);padding:16px;max-width:1200px;margin:0 auto;background-image:radial-gradient(ellipse at top,#1a1410 0%,#0c0a09 70%)}
  h1{font-size:24px;margin-bottom:4px;color:#e8dcc8;font-weight:normal;letter-spacing:1px}
  .subtitle{color:var(--muted);font-size:13px;margin-bottom:12px;font-style:italic}
  .header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:12px;border-bottom:1px solid var(--border);padding-bottom:12px}
  .cash{font-size:18px;color:#c9a87c;font-weight:bold}
  .mode-bar{display:flex;gap:8px;margin-bottom:12px;align-items:center;flex-wrap:wrap}
  .mode-bar button.active{background:#6b5a45;color:#f0e6d8}
  .progress-wrap{margin:8px 0 16px;background:#2a221e;border-radius:4px;height:8px;overflow:hidden}
  .progress-bar{height:100%;background:linear-gradient(90deg,#8b7355,#c9a87c);width:0%;transition:width .3s}
  .progress-text{font-size:12px;color:var(--muted);text-align:right;margin-top:2px}
  .indices{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:16px}
  .index-card{background:linear-gradient(180deg,#241c18 0%,#1c1614 100%);border:1px solid #3a2e28;border-radius:6px;padding:10px;text-align:center;box-shadow:inset 0 1px 0 rgba(255,220,180,.05)}
  .index-name{font-size:12px;color:var(--muted)}
  .index-price{font-size:20px;font-weight:bold;margin:2px 0}
  .index-change{font-size:12px}
  .up{color:var(--up)}.down{color:var(--down)}
  .section{background:linear-gradient(180deg,#1f1916 0%,#1c1614 100%);border:1px solid #3a2e28;border-radius:8px;padding:14px;margin-bottom:14px;box-shadow:0 4px 12px rgba(0,0,0,.4)}
  .section h2{font-size:15px;margin-bottom:10px;color:#d4c4a8;font-weight:normal}
  .search-bar{display:flex;gap:8px;margin-bottom:10px}
  input,button,select{background:#2a221e;border:1px solid #4a3c34;color:var(--text);padding:7px 10px;border-radius:4px;font-size:13px;font-family:inherit}
  input:focus,select:focus{outline:none;border-color:#8b7355}
  input{flex:1;min-width:0}
  button{background:linear-gradient(180deg,#6b5a45 0%,#5a4a38 100%);border:1px solid #8b7355;cursor:pointer;font-weight:500;color:#f0e6d8}
  button:hover{filter:brightness(1.1)}
  button.sell{background:linear-gradient(180deg,#8a3a3a 0%,#6a2a2a 100%);border-color:#aa5555}
  button.short{background:linear-gradient(180deg,#8a5a3a 0%,#6a3a2a 100%);border-color:#c47a4a}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:7px 5px;text-align:left;border-bottom:1px solid #2a221e}
  th{color:var(--muted);font-weight:500}
  .actions button{padding:3px 7px;font-size:12px;margin-right:3px}
  .update-time{font-size:12px;color:var(--muted);text-align:right;margin-top:6px;font-style:italic}
  .portfolio-summary{display:flex;gap:14px;margin-bottom:10px;font-size:13px;flex-wrap:wrap}
  .error{color:#ff6b6b;font-size:12px;margin-top:6px}
  .tag{display:inline-block;padding:1px 5px;border-radius:3px;font-size:11px}
  .tag.long{background:#52c41a33;color:#52c41a}.tag.short{background:#c47a4a33;color:#c47a4a}
  #klineBox,#minuteBox{margin-top:12px;background:#12100e;border:1px solid #3a2e28;border-radius:6px;padding:8px}
  canvas{width:100%;height:160px;display:block}
</style>
</head>
<body>
  <div class="header">
    <div>
      <h1>模拟大A 游戏</h1>
      <div class="subtitle">做多做空 · 离线进度条 · 分时图 · 仓位比例</div>
    </div>
    <div class="cash">可用资金：<span id="cash">100,000.00</span> 元</div>
  </div>

  <div class="mode-bar">
    <button id="btnRealtime" class="active" onclick="setMode('realtime')">实时行情</button>
    <button id="btnOffline" onclick="setMode('offline')">模拟当日走势</button>
    <button onclick="resetGame()">重置游戏</button>
    <select id="chartSelect" onchange="drawCharts()"><option value="">选择图表</option></select>
  </div>

  <div id="progressSection" style="display:none">
    <div class="progress-wrap"><div class="progress-bar" id="dayProgress"></div></div>
    <div class="progress-text" id="progressText">当日进度 0%</div>
  </div>

  <div class="indices" id="indices"></div>
  <div id="klineBox" style="display:none"><div style="font-size:12px;color:#8a7a6a;margin-bottom:4px">K线</div><canvas id="klineCanvas"></canvas></div>
  <div id="minuteBox" style="display:none"><div style="font-size:12px;color:#8a7a6a;margin-bottom:4px">分时图</div><canvas id="minuteCanvas"></canvas></div>

  <div class="section">
    <h2>自选股票</h2>
    <div class="search-bar">
      <input id="codeInput" placeholder="输入代码如 600519" />
      <button onclick="addStock()">添加</button>
    </div>
    <div id="error" class="error"></div>
    <table>
      <thead><tr><th>名称</th><th>代码</th><th>现价</th><th>涨跌幅</th><th>操作</th></tr></thead>
      <tbody id="watchlist"></tbody>
    </table>
  </div>

  <div class="section">
    <h2>我的持仓</h2>
    <div class="portfolio-summary">
      <div>市值：<span id="marketValue">0.00</span></div>
      <div>总资产：<span id="totalAsset">100,000.00</span></div>
      <div>浮盈：<span id="pnl">0.00</span></div>
      <div>仓位：<span id="positionRatio">0%</span></div>
    </div>
    <table>
      <thead><tr><th>名称</th><th>代码</th><th>方向</th><th>数量</th><th>成本</th><th>现价</th><th>盈亏</th><th>仓位%</th><th>操作</th></tr></thead>
      <tbody id="positions"></tbody>
    </table>
  </div>
  <div class="update-time" id="updateTime">加载中...</div>

<script>
const INITIAL_CASH = 100000;
const TOTAL_MINUTES = 240; // 模拟一天 240 分钟
let cash = INITIAL_CASH;
let mode = 'realtime';
let watchlist = [
  { code: "600519", name: "贵州茅台", secid: "1.600519", base: 1680 },
  { code: "000858", name: "五粮液", secid: "0.000858", base: 145 },
  { code: "300750", name: "宁德时代", secid: "0.300750", base: 210 },
  { code: "000001", name: "平安银行", secid: "0.000001", base: 11.5 }
];
let positions = {};
let quotes = {};
let klineData = {};
let minuteData = {};
let simTime = 0;
let simInterval = null;

const indices = [
  { name: "上证指数", secid: "1.000001", base: 3200 },
  { name: "深证成指", secid: "0.399001", base: 10200 },
  { name: "创业板指", secid: "0.399006", base: 2100 },
  { name: "科创50", secid: "1.000688", base: 980 }
];

function formatNum(n,d=2){return Number(n).toLocaleString("zh-CN",{minimumFractionDigits:d,maximumFractionDigits:d})}
function getColor(v){return v>0?"up":v<0?"down":""}

function setMode(m){
  mode=m;
  document.getElementById("btnRealtime").classList.toggle("active",m==='realtime');
  document.getElementById("btnOffline").classList.toggle("active",m==='offline');
  document.getElementById("progressSection").style.display = m==='offline' ? 'block' : 'none';
  if(simInterval)clearInterval(simInterval);
  if(m==='offline'){
    initSimulation();
    simInterval=setInterval(stepSimulation,800);
    if(watchlist.length>0){
      document.getElementById("chartSelect").value=watchlist[0].code;
      drawCharts();
    }
  } else updateAll();
}

function initSimulation(){
  simTime=0;
  const all=[...indices,...watchlist];
  all.forEach(item=>{
    const code=item.code||item.secid.split(".")[1];
    const base=item.base||100;
    quotes[code]={name:item.name,price:base,change:0,preClose:base,drift:(Math.random()-0.48)*0.022,base};
    klineData[code]=[];
    minuteData[code]=[base];
    for(let i=0;i<20;i++){
      const o=base*(1+(Math.random()-0.5)*0.015);
      const c=o*(1+(Math.random()-0.5)*0.012);
      klineData[code].push({o,h:Math.max(o,c)*1.005,l:Math.min(o,c)*0.995,c});
    }
  });
  updateChartSelect();
  renderAll();
  updateProgress();
  document.getElementById("updateTime").textContent="离线模拟已开始";
}

function stepSimulation(){
  if(simTime>=TOTAL_MINUTES){clearInterval(simInterval);document.getElementById("updateTime").textContent="当日收盘";return;}
  simTime++;
  Object.keys(quotes).forEach(code=>{
    const q=quotes[code];
    const noise=(Math.random()-0.5)*0.006;
    q.price=Math.max(0.01,q.price*(1+q.drift+noise));
    q.change=((q.price/q.preClose)-1)*100;
    minuteData[code].push(q.price);
    if(minuteData[code].length>TOTAL_MINUTES)minuteData[code].shift();
    if(simTime%5===0){
      const last=klineData[code][klineData[code].length-1]||{c:q.price};
      const o=last.c, c=q.price;
      klineData[code].push({o,h:Math.max(o,c)*1.004,l:Math.min(o,c)*0.996,c});
      if(klineData[code].length>50)klineData[code].shift();
    }
  });
  renderAll();
  drawCharts();
  updateProgress();
  document.getElementById("updateTime").textContent=`离线 · ${simTime}/${TOTAL_MINUTES} 分`;
}

function updateProgress(){
  const pct=Math.min(100,(simTime/TOTAL_MINUTES)*100);
  document.getElementById("dayProgress").style.width=pct+"%";
  document.getElementById("progressText").textContent=`当日进度 ${pct.toFixed(0)}% · ${simTime}分钟`;
}

async function updateAll(){
  if(mode!=='realtime')return;
  const secids=[...indices.map(i=>i.secid),...watchlist.map(w=>w.secid)];
  try{
    const res=await fetch(`https://push2.eastmoney.com/api/qt/ulist.np/get?fltt=2&secids=${secids.join(",")}&fields=f2,f3,f12,f14,f18&_=${Date.now()}`);
    const data=await res.json();
    (data.data?.diff||[]).forEach(item=>{
      quotes[item.f12]={name:item.f14,price:item.f2,change:item.f3,preClose:item.f18};
    });
  }catch(e){}
  renderAll();
  document.getElementById("updateTime").textContent="实时 · "+new Date().toLocaleString();
}

function updateChartSelect(){
  const sel=document.getElementById("chartSelect");
  const cur=sel.value;
  sel.innerHTML='<option value="">选择图表</option>'+watchlist.map(w=>`<option value="${w.code}">${w.name} ${w.code}</option>`).join("");
  if(cur)sel.value=cur;
  else if(watchlist.length>0 && mode==='offline') sel.value=watchlist[0].code;
}

function drawCharts(){
  const code=document.getElementById("chartSelect").value;
  drawKline(code);
  drawMinute(code);
}

function drawKline(code){
  const box=document.getElementById("klineBox");
  const canvas=document.getElementById("klineCanvas");
  if(!code||!klineData[code]||klineData[code].length<2){box.style.display="none";return;}
  box.style.display="block";
  const ctx=canvas.getContext("2d");
  const w=canvas.width=canvas.offsetWidth*2, h=canvas.height=320;
  ctx.clearRect(0,0,w,h);
  const data=klineData[code].slice(-40);
  const max=Math.max(...data.map(d=>d.h)), min=Math.min(...data.map(d=>d.l));
  const range=max-min||1, cw=w/data.length;
  data.forEach((d,i)=>{
    const x=i*cw+cw/2;
    const yo=(d.o-min)/range*h*0.8+h*0.1, yc=(d.c-min)/range*h*0.8+h*0.1;
    const yh=(d.h-min)/range*h*0.8+h*0.1, yl=(d.l-min)/range*h*0.8+h*0.1;
    const color=d.c>=d.o?"#ff4d4f":"#52c41a";
    ctx.strokeStyle=color; ctx.beginPath(); ctx.moveTo(x,yh); ctx.lineTo(x,yl); ctx.stroke();
    ctx.fillStyle=color; ctx.fillRect(x-cw*0.3,Math.min(yo,yc),cw*0.6,Math.abs(yc-yo)||1);
  });
}

function drawMinute(code){
  const box=document.getElementById("minuteBox");
  const canvas=document.getElementById("minuteCanvas");
  if(!code||!minuteData[code]||minuteData[code].length<2){box.style.display="none";return;}
  box.style.display="block";
  const ctx=canvas.getContext("2d");
  const w=canvas.width=canvas.offsetWidth*2, h=canvas.height=280;
  ctx.clearRect(0,0,w,h);
  const data=minuteData[code];
  const max=Math.max(...data), min=Math.min(...data);
  const range=max-min||1;
  ctx.beginPath();
  data.forEach((p,i)=>{
    const x=(i/(data.length-1))*w;
    const y=h-((p-min)/range)*h*0.85-h*0.075;
    if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  });
  ctx.strokeStyle="#c9a87c"; ctx.lineWidth=2; ctx.stroke();
}

function renderAll(){renderIndices();renderWatchlist();renderPositions();}

function renderIndices(){
  document.getElementById("indices").innerHTML=indices.map(idx=>{
    const code=idx.secid.split(".")[1];
    const q=quotes[code]||{};
    const chg=q.change||0;
    return `<div class="index-card"><div class="index-name">${idx.name}</div><div class="index-price ${getColor(chg)}">${formatNum(q.price||0)}</div><div class="index-change ${getColor(chg)}">${chg>0?"+":""}${formatNum(chg)}%</div></div>`;
  }).join("");
}

function renderWatchlist(){
  document.getElementById("watchlist").innerHTML=watchlist.map(w=>{
    const q=quotes[w.code]||{};
    const chg=q.change||0;
    return `<tr><td>${q.name||w.name}</td><td>${w.code}</td><td class="${getColor(chg)}">${formatNum(q.price||0)}</td><td class="${getColor(chg)}">${chg>0?"+":""}${formatNum(chg)}%</td><td class="actions"><button onclick="trade('${w.code}','buy')">做多</button><button class="short" onclick="trade('${w.code}','short')">做空</button></td></tr>`;
  }).join("");
}

function renderPositions(){
  let mv=0,pnl=0,totalUsed=0;
  const totalAsset=cash+Object.values(positions).reduce((s,[c,p])=>s+(quotes[c]?.price||p.cost)*Math.abs(p.shares),0);
  const rows=Object.entries(positions).map(([code,pos])=>{
    const q=quotes[code]||{};
    const price=q.price||pos.cost;
    const isLong=pos.shares>0;
    const abs=Math.abs(pos.shares);
    const value=price*abs;
    const p=isLong?(price-pos.cost)*abs:(pos.cost-price)*abs;
    mv+=isLong?value:-value;
    pnl+=p;
    totalUsed+=value;
    const ratio=((value/totalAsset)*100).toFixed(1);
    return `<tr><td>${pos.name}</td><td>${code}</td><td><span class="tag ${isLong?'long':'short'}">${isLong?'多':'空'}</span></td><td>${abs}</td><td>${formatNum(pos.cost)}</td><td class="${getColor(isLong?price-pos.cost:pos.cost-price)}">${formatNum(price)}</td><td class="${getColor(p)}">${p>0?"+":""}${formatNum(p)}</td><td>${ratio}%</td><td class="actions"><button class="sell" onclick="closePosition('${code}')">平仓</button></td></tr>`;
  }).join("");
  document.getElementById("positions").innerHTML=rows||"<tr><td colspan='9' style='text-align:center;color:#8a7a6a'>暂无持仓</td></tr>";
  document.getElementById("marketValue").textContent=formatNum(mv);
  document.getElementById("totalAsset").textContent=formatNum(cash+mv);
  document.getElementById("pnl").textContent=(pnl>0?"+":"")+formatNum(pnl);
  document.getElementById("pnl").className=getColor(pnl);
  document.getElementById("cash").textContent=formatNum(cash);
  document.getElementById("positionRatio").textContent=((totalUsed/(cash+Math.abs(mv)||1))*100).toFixed(1)+"%";
}

function trade(code,side){
  const q=quotes[code];
  if(!q?.price)return alert("暂无行情");
  const price=q.price;
  const action=side==="buy"?"做多":"做空";
  const shares=prompt(`${action} ${q.name}\n现价：${formatNum(price)}\n股数(100倍)：`,"100");
  if(!shares||shares%100!==0||shares<=0)return alert("请输入100整数倍");
  const qty=+shares;
  const amount=price*qty;
  if(amount>cash)return alert("资金不足");
  cash-=amount;
  if(!positions[code])positions[code]={shares:0,cost:0,name:q.name};
  const pos=positions[code];
  const total=pos.cost*Math.abs(pos.shares)+amount;
  pos.shares+=side==="buy"?qty:-qty;
  pos.cost=total/Math.abs(pos.shares);
  if(pos.shares===0)delete positions[code];
  renderPositions();
  if(mode==='offline'){
    document.getElementById("chartSelect").value=code;
    drawCharts();
  }
}

function closePosition(code){
  const pos=positions[code];
  if(!pos)return;
  const q=quotes[code];
  if(!q?.price)return alert("暂无行情");
  cash+=q.price*Math.abs(pos.shares);
  delete positions[code];
  renderPositions();
}

function addStock(){
  const code=document.getElementById("codeInput").value.trim();
  if(!code||watchlist.find(w=>w.code===code)){
    document.getElementById("error").textContent=code?"已存在":"";
    return;
  }
  const secid=(code.startsWith("6")||code.startsWith("5"))?`1.${code}`:`0.${code}`;
  watchlist.push({code,name:code,secid,base:20+Math.random()*80});
  document.getElementById("codeInput").value="";
  document.getElementById("error").textContent="";
  updateChartSelect();
  if(mode==='offline')initSimulation();
  else updateAll();
}

function resetGame(){
  if(!confirm("重置资金和持仓？"))return;
  cash=INITIAL_CASH;
  positions={};
  renderPositions();
  if(mode==='offline')initSimulation();
}

updateChartSelect();
setMode('realtime');
setInterval(()=>{if(mode==='realtime')updateAll();},6000);
window.addEventListener('resize',drawCharts);
</script>
</body>
</html>
