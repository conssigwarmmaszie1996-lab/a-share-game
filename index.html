<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>模拟大A游戏</title>
<style>
  :root { --bg:#0c0a09; --card:#1c1614; --up:#ff4d4f; --down:#52c41a; --text:#d4c8b8; --muted:#8a7a6a; --accent:#8b7355; --short:#c47a4a; }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Georgia,serif;background:var(--bg);color:var(--text);padding:16px;max-width:1100px;margin:0 auto}
  h1{font-size:22px;margin-bottom:6px;color:#e8dcc8}
  .header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap}
  .cash{font-size:18px;color:#c9a87c;font-weight:bold}
  .mode-bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
  .mode-bar button.active{background:#6b5a45}
  button{background:#6b5a45;border:1px solid #8b7355;color:#f0e6d8;padding:7px 12px;border-radius:4px;cursor:pointer}
  button.short{background:#8a5a3a}
  button.sell{background:#8a3a3a}
  .section{background:#1c1614;border:1px solid #3a2e28;border-radius:8px;padding:14px;margin-bottom:14px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:6px 4px;border-bottom:1px solid #2a221e;text-align:left}
  .summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:10px}
  .summary-item{background:#2a221e;padding:8px;border-radius:6px;text-align:center}
  .summary-item .label{font-size:12px;color:#8a7a6a}
  .summary-item .value{font-size:15px;font-weight:bold;margin-top:2px}
  .up{color:#ff4d4f}.down{color:#52c41a}
  #progressSection{margin:8px 0}
  .progress-wrap{background:#2a221e;height:8px;border-radius:4px;overflow:hidden}
  .progress-bar{height:100%;background:#c9a87c;width:0%}
  canvas{width:100%;height:140px;background:#12100e;border-radius:4px;margin-top:6px}
</style>
</head>
<body>
  <div class="header">
    <h1>模拟大A 游戏</h1>
    <div class="cash">可用资金：<span id="cash">100,000.00</span></div>
  </div>
  <div class="mode-bar">
    <button id="btnRealtime" class="active" onclick="setMode('realtime')">实时</button>
    <button id="btnOffline" onclick="setMode('offline')">离线模拟当日</button>
    <button onclick="resetGame()">重置</button>
  </div>
  <div id="progressSection" style="display:none">
    <div class="progress-wrap"><div class="progress-bar" id="dayProgress"></div></div>
    <div style="font-size:12px;color:#8a7a6a;text-align:right" id="progressText">进度 0%</div>
  </div>
  <div class="indices" id="indices" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:12px"></div>
  <div class="section">
    <h2>自选</h2>
    <table id="watchlistTable">
      <thead><tr><th>名称</th><th>代码</th><th>现价</th><th>涨跌</th><th>操作</th></tr></thead>
      <tbody id="watchlist"></tbody>
    </table>
  </div>
  <div class="section">
    <h2>我的持仓</h2>
    <div class="summary">
      <div class="summary-item"><div class="label">可用资金</div><div class="value" id="sCash">100000</div></div>
      <div class="summary-item"><div class="label">持仓市值</div><div class="value" id="sMv">0</div></div>
      <div class="summary-item"><div class="label">总资产</div><div class="value" id="sTotal">100000</div></div>
      <div class="summary-item"><div class="label">浮盈</div><div class="value" id="sPnl">0</div></div>
      <div class="summary-item"><div class="label">仓位</div><div class="value" id="sRatio">0%</div></div>
    </div>
    <table>
      <thead><tr><th>名称</th><th>代码</th><th>方向</th><th>数量</th><th>成本</th><th>现价</th><th>盈亏</th><th>操作</th></tr></thead>
      <tbody id="positions"></tbody>
    </table>
  </div>
  <div id="chartBox" style="display:none"><canvas id="chart"></canvas></div>
  <div style="font-size:12px;color:#8a7a6a;text-align:right;margin-top:8px" id="updateTime"></div>

<script>
let cash = 100000;
let mode = 'realtime';
let watchlist = [
  {code:'600519', name:'贵州茅台', base:1680},
  {code:'000858', name:'五粮液', base:145},
  {code:'300750', name:'宁德时代', base:210},
  {code:'000001', name:'平安银行', base:11.5}
];
let positions = {};
let quotes = {};
let simTime = 0;
let simTimer = null;

function fmt(n){ return Number(n).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function color(v){ return v>0?'up':v<0?'down':''; }

function setMode(m){
  mode = m;
  document.getElementById('btnRealtime').classList.toggle('active', m==='realtime');
  document.getElementById('btnOffline').classList.toggle('active', m==='offline');
  document.getElementById('progressSection').style.display = m==='offline'?'block':'none';
  if(simTimer) clearInterval(simTimer);
  if(m==='offline'){
    initOffline();
    simTimer = setInterval(stepOffline, 1000);
  } else {
    updateRealtime();
  }
}

function initOffline(){
  simTime = 0;
  watchlist.forEach(w=>{
    quotes[w.code] = {name:w.name, price:w.base, change:0, pre:w.base};
  });
  renderAll();
  document.getElementById('updateTime').textContent = '离线模拟开始';
}

function stepOffline(){
  if(simTime>=240){ clearInterval(simTimer); document.getElementById('updateTime').textContent='收盘'; return; }
  simTime++;
  Object.keys(quotes).forEach(code=>{
    const q = quotes[code];
    const chg = (Math.random()-0.5)*0.008;
    q.price = Math.max(0.01, q.price*(1+chg));
    q.change = ((q.price/q.pre)-1)*100;
  });
  renderAll();
  const pct = (simTime/240*100).toFixed(0);
  document.getElementById('dayProgress').style.width = pct+'%';
  document.getElementById('progressText').textContent = `进度 ${pct}% · ${simTime}分`;
  document.getElementById('updateTime').textContent = `离线 ${simTime}/240 分`;
}

async function updateRealtime(){
  if(mode!=='realtime') return;
  try{
    const codes = watchlist.map(w=> (w.code.startsWith('6')?'1.':'0.')+w.code).join(',');
    const res = await fetch(`https://push2.eastmoney.com/api/qt/ulist.np/get?fltt=2&secids=${codes}&fields=f2,f3,f12,f14&_=${Date.now()}`);
    const data = await res.json();
    (data.data?.diff||[]).forEach(i=>{
      quotes[i.f12] = {name:i.f14, price:i.f2, change:i.f3};
    });
  }catch(e){}
  renderAll();
  document.getElementById('updateTime').textContent = '实时 '+new Date().toLocaleTimeString();
}

function renderAll(){
  // 指数简化显示
  document.getElementById('indices').innerHTML = watchlist.slice(0,4).map(w=>{
    const q = quotes[w.code]||{};
    const ch = q.change||0;
    return `<div style="background:#1c1614;padding:8px;border-radius:6px;text-align:center"><div style="font-size:12px;color:#8a7a6a">${w.name}</div><div class="${color(ch)}">${fmt(q.price||0)}</div><div class="${color(ch)}">${ch>0?'+':''}${ch.toFixed(2)}%</div></div>`;
  }).join('');

  // 自选
  document.getElementById('watchlist').innerHTML = watchlist.map(w=>{
    const q = quotes[w.code]||{};
    const ch = q.change||0;
    return `<tr>
      <td>${w.name}</td><td>${w.code}</td>
      <td class="${color(ch)}">${fmt(q.price||0)}</td>
      <td class="${color(ch)}">${ch>0?'+':''}${ch.toFixed(2)}%</td>
      <td>
        <button onclick="openPos('${w.code}','long')">做多</button>
        <button class="short" onclick="openPos('${w.code}','short')">做空</button>
      </td>
    </tr>`;
  }).join('');

  // 持仓
  let mv=0, pnl=0;
  const rows = Object.entries(positions).map(([code, p])=>{
    const q = quotes[code]||{};
    const price = q.price || p.cost;
    const isLong = p.shares>0;
    const abs = Math.abs(p.shares);
    const value = price * abs;
    const profit = isLong ? (price-p.cost)*abs : (p.cost-price)*abs;
    mv += isLong ? value : -value;
    pnl += profit;
    return `<tr>
      <td>${p.name}</td><td>${code}</td>
      <td>${isLong?'多':'空'}</td><td>${abs}</td>
      <td>${fmt(p.cost)}</td>
      <td class="${color(isLong?price-p.cost:p.cost-price)}">${fmt(price)}</td>
      <td class="${color(profit)}">${profit>0?'+':''}${fmt(profit)}</td>
      <td><button class="sell" onclick="closePos('${code}')">平仓</button></td>
    </tr>`;
  }).join('');
  document.getElementById('positions').innerHTML = rows || '<tr><td colspan="8" style="text-align:center;color:#8a7a6a">暂无持仓</td></tr>';

  const total = cash + mv;
  document.getElementById('sCash').textContent = fmt(cash);
  document.getElementById('sMv').textContent = fmt(mv);
  document.getElementById('sTotal').textContent = fmt(total);
  document.getElementById('sPnl').textContent = (pnl>0?'+':'')+fmt(pnl);
  document.getElementById('sPnl').className = 'value '+color(pnl);
  document.getElementById('cash').textContent = fmt(cash);
  const used = Object.values(positions).reduce((s,p)=>s+Math.abs(p.shares)*(quotes[Object.keys(positions).find(k=>positions[k]===p)]?.price||p.cost),0);
  document.getElementById('sRatio').textContent = ((used/(cash+Math.abs(mv)||1))*100).toFixed(1)+'%';
}

function openPos(code, side){
  const q = quotes[code];
  if(!q || !q.price){
    alert('暂无行情，请先切到离线模拟或等待实时数据');
    return;
  }
  const price = q.price;
  const qtyStr = prompt(`做${side==='long'?'多':'空'} ${q.name}（${code}）\n现价：${fmt(price)}\n输入股数（100整数倍）：`, '100');
  if(!qtyStr) return;
  const qty = parseInt(qtyStr);
  if(isNaN(qty) || qty<=0 || qty%100!==0){
    alert('请输入100的整数倍');
    return;
  }
  const amount = price * qty;
  if(amount > cash){
    alert('资金不足');
    return;
  }
  cash -= amount;
  if(!positions[code]) positions[code] = {shares:0, cost:0, name:q.name};
  const pos = positions[code];
  const oldAbs = Math.abs(pos.shares);
  const totalCost = pos.cost * oldAbs + amount;
  pos.shares += (side==='long' ? qty : -qty);
  const newAbs = Math.abs(pos.shares);
  pos.cost = newAbs>0 ? totalCost / newAbs : 0;
  if(pos.shares===0) delete positions[code];
  renderAll();
  alert(`开仓成功！${side==='long'?'多':' 空'} ${qty}股，占用资金 ${fmt(amount)}`);
}

function closePos(code){
  const pos = positions[code];
  if(!pos) return;
  const q = quotes[code];
  if(!q || !q.price){ alert('暂无行情'); return; }
  const abs = Math.abs(pos.shares);
  cash += q.price * abs;
  delete positions[code];
  renderAll();
  alert('平仓成功');
}

function resetGame(){
  if(!confirm('重置资金和持仓？')) return;
  cash = 100000;
  positions = {};
  renderAll();
  if(mode==='offline') initOffline();
}

setMode('realtime');
setInterval(()=>{ if(mode==='realtime') updateRealtime(); }, 6000);
</script>
</body>
</html>
